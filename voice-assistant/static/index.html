<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Голосовой помощник: задачи и встречи</title>
<style>
:root{--ink:#12202b;--mute:#5d6b75;--paper:#e9eeec;--card:#fbfcfb;--line:#cfd8d4;--accent:#0e5c55;--accent-ink:#fff;--rec:#d98a00;--meet:#0e5c55;--task:#41505b;--rem:#a5640a}
@media(prefers-color-scheme:dark){:root{--ink:#e6edf0;--mute:#9aa8b1;--paper:#0f1a20;--card:#16242c;--line:#2a3b45;--accent:#3fb5a6;--accent-ink:#06201d;--rec:#f0b030;--meet:#3fb5a6;--task:#9fb0bb;--rem:#e0a040}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:18px;margin:0;font-weight:650;flex:1}
#st{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
#st i{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}
#st.ok i{background:#2e9d5b}#st.wait i{background:var(--rec)}#st.bad i{background:#c0392b}
.tabs{display:none;border-bottom:1px solid var(--line);background:var(--card)}
.tabs button{flex:1;padding:10px;border:0;background:none;color:var(--mute);font:inherit;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
section{min-height:0;display:flex;flex-direction:column}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(560px,88%);padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.bot small{display:block;color:var(--mute);font-size:12px;margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
form{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);align-items:center}
input[type=text]{flex:1;min-width:0;padding:12px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#mic{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:22px;cursor:pointer;flex:none}
#mic.rec{background:var(--rec);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(217,138,0,.18)}}
@media(prefers-reduced-motion:reduce){#mic.rec{animation:none}}
#send{border:0;background:none;color:var(--accent);font:inherit;font-weight:650;padding:8px;cursor:pointer}
aside{border-left:1px solid var(--line);background:var(--card);overflow-y:auto;padding:14px 16px}
aside h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
aside h2 a{font-size:13px;color:var(--accent);text-decoration:none;font-weight:400}
.day{font-size:13px;color:var(--mute);margin:14px 0 4px}
.it{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.it .b{flex:1;min-width:0}.it .t{font-weight:550;word-wrap:break-word}.it .m{font-size:13px;color:var(--mute)}
.it.done .t{text-decoration:line-through;color:var(--mute)}
.tag{font-size:12px;font-weight:600}.tag.meeting{color:var(--meet)}.tag.task{color:var(--task)}.tag.reminder{color:var(--rem)}
.it button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;width:32px;height:32px;cursor:pointer}
.empty{color:var(--mute);font-size:14px}
#hint{font-size:13px;color:var(--mute);padding:0 16px 6px}
label.tg{font-size:13px;color:var(--mute);display:flex;gap:4px;align-items:center;white-space:nowrap}
@media(max-width:860px){.tabs{display:flex}main{grid-template-columns:1fr}aside{display:none;border:0}main.rec aside{display:block}main.rec section{display:none}}
</style>
</head>
<body>
<header><h1>Помощник: задачи и встречи</h1><label class="tg"><input type="checkbox" id="tts" checked> озвучка</label><span id="st" class="wait"><i></i><b>подключаюсь…</b></span></header>
<div class="tabs"><button id="t1" class="on">Диалог</button><button id="t2">Записи</button></div>
<main id="main">
<section>
<div id="chat" aria-live="polite"></div>
<div id="hint"></div>
<div class="chips" id="chips"></div>
<form id="f"><button type="button" id="mic" aria-label="Говорить">🎤</button><input type="text" id="q" placeholder="Скажите или напишите команду" autocomplete="off" maxlength="500"><button id="send">Отправить</button></form>
</section>
<aside><h2>Мои записи <a id="csv" href="#">скачать CSV</a></h2><div id="list"></div></aside>
</main>
<script>
const $=s=>document.querySelector(s);
const UID=localStorage.getItem('uid')||(()=>{let u=((crypto.randomUUID&&crypto.randomUUID())||(Date.now()+Math.random().toString(36).slice(2))).replace(/[^A-Za-z0-9_-]/g,'');localStorage.setItem('uid',u);return u})();
const pad=n=>String(n).padStart(2,'0');
const nowIso=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`};
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const TYPE={task:'Задача',meeting:'Встреча',reminder:'Напоминание'};
function setSt(c,t){const s=$('#st');s.className=c;s.querySelector('b').textContent=t}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(path,opt={},tries=4){
  for(let i=0;i<tries;i++){
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),20000);
    try{const r=await fetch(path,{...opt,signal:ac.signal});clearTimeout(to);if(!r.ok)throw new Error(r.status);return r}
    catch(e){clearTimeout(to);setSt('wait','сервер просыпается…');if(i==tries-1){setSt('bad','нет связи с сервером');throw e}await sleep(2500)}
  }
}
function add(text,who,meta){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;
  if(meta){const s=document.createElement('small');s.textContent=meta;d.appendChild(s)}
  $('#chat').appendChild(d);$('#chat').scrollTop=1e9;return d}
let voice=null;
function speak(t){if(!$('#tts').checked||!('speechSynthesis' in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';voice=voice||speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('ru'));if(voice)u.voice=voice;speechSynthesis.speak(u)}
async function send(text){
  text=text.trim();if(!text)return;add(text,'me');$('#q').value='';
  const wait=add('…','bot');
  try{
    const r=await api('/api/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:UID,text,now:nowIso()})});
    const j=await r.json();wait.remove();
    add(j.reply,'bot',j.source==='llm'?'GigaChat':'базовый режим');
    setSt('ok',j.source==='llm'?'онлайн · GigaChat':'онлайн · базовый режим');
    speak(j.speech);if(j.refresh)loadList();
  }catch(e){wait.textContent='Не удалось связаться с сервером. Попробуйте ещё раз.'}
}
function dayLabel(iso){if(!iso)return 'Без даты';const [y,m,d]=iso.split('-').map(Number);const t=new Date();const a=new Date(y,m-1,d),b=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const k=Math.round((a-b)/864e5);const base=`${d} ${MON[m-1]}`;return k===0?'Сегодня, '+base:k===1?'Завтра, '+base:base}
async function loadList(){
  try{const r=await api('/api/items?user='+UID,{},2);const {items}=await r.json();const box=$('#list');box.innerHTML='';
    if(!items.length){box.innerHTML='<p class="empty">Пока пусто. Скажите: «Напомни завтра в 10 позвонить Ивану».</p>';return}
    let cur;items.forEach(it=>{
      if(it.date!==cur){cur=it.date;const h=document.createElement('div');h.className='day';h.textContent=dayLabel(it.date);box.appendChild(h)}
      const row=document.createElement('div');row.className='it'+(it.status==='done'?' done':'');
      row.innerHTML='<div class="b"><div class="t"></div><div class="m"></div></div>';
      row.querySelector('.t').textContent=it.title;
      const m=row.querySelector('.m');const tag=document.createElement('span');tag.className='tag '+it.type;tag.textContent=TYPE[it.type];m.appendChild(tag);m.append(it.time?' · '+it.time:'');
      if(it.status!=='done'){const b=document.createElement('button');b.textContent='✓';b.title='Выполнено';b.onclick=async()=>{await api('/api/items/'+it.id+'/done',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:UID})});loadList()};row.appendChild(b)}
      const x=document.createElement('button');x.textContent='✕';x.title='Удалить';x.onclick=async()=>{await api('/api/items/'+it.id+'?user='+UID,{method:'DELETE'});loadList()};row.appendChild(x);
      box.appendChild(row)})
  }catch(e){}
}
// голос
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,listening=false;
if(!SR){$('#mic').disabled=true;$('#mic').style.opacity=.4;$('#hint').textContent='Голосовой ввод работает в Chrome, Edge и Safari. Здесь можно писать текстом.'}
else{rec=new SR();rec.lang='ru-RU';rec.interimResults=true;rec.continuous=false;let fin='';
  rec.onresult=e=>{let t='';fin='';for(const r of e.results){t+=r[0].transcript;if(r.isFinal)fin+=r[0].transcript}$('#q').value=t};
  rec.onend=()=>{listening=false;$('#mic').classList.remove('rec');const t=$('#q').value;if(t.trim())send(t)};
  rec.onerror=e=>{listening=false;$('#mic').classList.remove('rec');if(e.error==='not-allowed')$('#hint').textContent='Разрешите доступ к микрофону в настройках браузера.';else if(e.error==='no-speech')$('#hint').textContent='Речь не распознана. Попробуйте ещё раз.'};
  $('#mic').onclick=()=>{if(listening){rec.stop();return}speechSynthesis&&speechSynthesis.cancel();$('#hint').textContent='';$('#q').value='';try{rec.start();listening=true;$('#mic').classList.add('rec')}catch(e){}}}
$('#f').onsubmit=e=>{e.preventDefault();send($('#q').value)};
['Напомни завтра в 10 утра позвонить Ивану','Добавь встречу с командой завтра в 15:00','Что у меня сегодня?','Что запланировано на эту неделю?','Найди задачу про договор'].forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>send(t);$('#chips').appendChild(b)});
$('#csv').onclick=e=>{e.preventDefault();location.href='/api/export.csv?user='+UID};
$('#t1').onclick=()=>{$('#main').classList.remove('rec');$('#t1').classList.add('on');$('#t2').classList.remove('on')};
$('#t2').onclick=()=>{$('#main').classList.add('rec');$('#t2').classList.add('on');$('#t1').classList.remove('on');loadList()};
add('Здравствуйте! Нажмите на микрофон или напишите: например, «Напомни завтра в 10 утра позвонить Ивану». Если не хватит данных, я уточню.','bot');
api('/health',{},6).then(r=>r.json()).then(j=>setSt('ok',j.llm?'онлайн · GigaChat':'онлайн · базовый режим')).catch(()=>{});
loadList();
</script>
</body>
</html>
