meta:
  environment: python
  toolchain:
    name: pip
    version: "3.12"
build:
  requirementsPath: requirements.txt
run:
  # один процесс: диалоговый контекст хранится в памяти процесса
  command: gunicorn -b 0.0.0.0:8080 -w 1 --threads 8 --timeout 60 app:app
  persistenceMount: /data
  containerPort: 8080
